# ─── The Vic 361 — Local Events ─────────────────────────────────────────────
# This file contains manually curated events and recurring events.
# Caspian or Tristen updates this file with events found on Facebook,
# Instagram, or word-of-mouth that aren't on public calendars.
#
# RECURRING events auto-generate for each matching day of the week.
