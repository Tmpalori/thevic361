# ─── The Vic 361 — Weekly Event Collection ───────────────────────────────────
# Runs every Sunday at 6:00 PM Central (23:00 UTC during CDT) to collect events
# and update the website's events.json.
# Also runs on manual trigger (workflow_dispatch).
# ─────────────────────────────────────────────────────────────────────────────

name: Weekly Collect

on:
  schedule:
    - cron: '0 23 * * 0'  # 6:00 PM Central, Sunday (UTC-5 during CDT)
  workflow_dispatch:       # Manual trigger from GitHub UI

permissions:
  contents: write          # Needed to push updated events.json

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover venues (Google Maps)
        # Non-destructive: if APIFY_TOKEN is missing or the actor fails,
        # discover_venues.py exits 0 and leaves existing venue files alone.
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python discover_venues.py || echo "Venue discovery skipped (non-fatal)"

      - name: Run event collector
        env:
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          APIFY_TOKEN:        ${{ secrets.APIFY_TOKEN }}
          SENTRY_DSN:         ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
          # Toggle the FB-posts → sonar pipeline. Off until the Apify monthly
          # cap resets and we've verified post-volume cost. Set repository
          # variable FB_POSTS_ENABLED=1 (Settings → Variables → Actions) to
          # turn on without editing this file.
          FB_POSTS_ENABLED:   ${{ vars.FB_POSTS_ENABLED }}
          # Toggle the IG-posts → sonar pipeline (mirrors FB_POSTS_ENABLED).
          # Off until production-validated. Set repository variable
          # IG_POSTS_ENABLED=1 (Settings → Variables → Actions) to enable.
          IG_POSTS_ENABLED:   ${{ vars.IG_POSTS_ENABLED }}
        run: |
          python collect_events.py \
            --output ./docs/events.json \
            --candidates ./candidates.json \
            --local-dir . \
            --days 14

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet docs/events.json candidates.json venues.json pending_venues.json facebook_venues.backup.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "The Vic 361 Bot"
          git config user.email "bot@thevic361.com"
          # Add venue files only if they exist (discovery may have been skipped).
          for f in venues.json pending_venues.json facebook_venues.backup.json; do
            [ -f "$f" ] && git add "$f"
          done
          git add docs/events.json candidates.json
          git commit -m "🏙️ Update events $(date +'%Y-%m-%d')"
          git push
