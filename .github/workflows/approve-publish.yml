# ─── The Vic 361 — Approve & Publish ─────────────────────────────────────────
# Manually triggered after Tristen reviews the weekly digest email.
# Paste the numbers you want to keep into the `picks` input
# (e.g. "1,3,5,8" or "1-10,15" or "ALL") and the workflow runs
# approve_events.py and pushes the updated docs/events.json.
# ─────────────────────────────────────────────────────────────────────────────

name: Approve & Publish

on:
  workflow_dispatch:
    inputs:
      picks:
        description: 'Event numbers to keep (e.g. "1,3,5,8" or "1-10" or "ALL")'
        required: true
        default: 'ALL'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Approve events
        run: |
          python approve_events.py ${{ github.event.inputs.picks }} \
            --candidates ./candidates.json \
            --output ./docs/events.json \
            --extras ./extras.yaml

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet docs/events.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "The Vic 361 Bot"
          git config user.email "bot@thevic361.com"
          git add docs/events.json
          git commit -m "🏙️ Approved events $(date +'%Y-%m-%d')"
          git push
