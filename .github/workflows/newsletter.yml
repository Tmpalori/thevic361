# Newsletter — backup for the Monday send.
#
# The site sends the newsletter itself at 7:43 AM Central
# (server/scheduler.js), because GitHub's cron runs hours late on this repo.
# This workflow calls the same send (/api/newsletter/cron, server/newsletter.js)
# as a fallback: a week that already went out is skipped, and a partly failed
# one resends only to the people who missed it, so running it is always safe.
#
# The on/off switch is the NEWSLETTER_AUTOSEND Railway variable (on unless
# it is 0); the scheduled run tells the site it's automatic, so it obeys
# that too. Run it by hand to send now regardless. Needs the
# NEWSLETTER_CRON_SECRET secret to match the Railway variable of the same
# name. The same call sends last week's sponsor click reports.

name: Newsletter

on:
  schedule:
    - cron: '43 12 * * 1'   # 7:43 AM CDT; usually runs hours late (fallback)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6   # for scripts/slack_notify.py
      - name: Send this week's newsletter
        env:
          SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}
          SITE: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          if [ -z "$SECRET" ]; then echo "::error::NEWSLETTER_CRON_SECRET is not set"; exit 1; fi
          # Up to 4 tries: a Railway redeploy (502/000) or a Resend hiccup
          # (500 with failed_emails) clears up, and a retry only resends to
          # whoever missed it.
          for wait in 120 300 600 0; do
            code=$(curl -sS -o out.json -w '%{http_code}' --max-time 300 -X POST \
              -H "X-Cron-Secret: $SECRET" -H "X-Cron-Scheduled: $SCHEDULED" "$SITE/api/newsletter/cron") || code=000
            cat out.json 2>/dev/null || true; echo
            [ "$code" = "200" ] && exit 0
            # 4xx (bad secret, etc.) won't fix itself.
            case "$code" in 4*) echo "::error::Newsletter send returned HTTP $code"; exit 1;; esac
            [ "$wait" = "0" ] && break
            echo "HTTP $code; trying again in ${wait}s"; sleep "$wait"
          done
          echo "::error::Newsletter send returned HTTP $code after 4 tries"; exit 1

      - name: Tell Slack it failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/slack_notify.py "🚨 Monday newsletter send failed" --link "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
