# Newsletter — backup for the Monday send.
#
# The site sends the newsletter itself at 7:43 AM Central
# (server/scheduler.js), because GitHub's cron runs hours late on this repo.
# This workflow calls the same send (/api/newsletter/cron, server/newsletter.js)
# as a fallback: a week that already went out is skipped, and a partly failed
# one resends only to the people who missed it, so running it is always safe.
#
# The on/off switch is the NEWSLETTER_AUTOSEND Railway variable (on unless
# it is 0); the scheduled run tells the site it's automatic, so it obeys
# that too. Run it by hand to send now regardless. Needs the
# NEWSLETTER_CRON_SECRET secret to match the Railway variable of the same
# name. A 5xx or no answer is tried up to 3 times about 4 minutes apart
# (safe: the send resumes and never mails anyone twice). The same call sends last week's sponsor click reports.

name: Newsletter

on:
  schedule:
    - cron: '43 12 * * 1'   # 7:43 AM CDT; usually runs hours late (fallback)
    - cron: '43 13 * * 1'   # 7:43 AM CST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A cron at the other DST's time is skipped (pinned to CDT alone, the
  # winter run sent at 6:43 CST, before the 6:43 event check had hidden
  # anything), and so is a late run after the site already sent.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SITE: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          CDT_CRON: '43 12 * * 1'
          CST_CRON: '43 13 * * 1'
        run: |
          run=true
          if [ "$EVENT" = "schedule" ]; then
            # GitHub's cron is UTC, so the slot is listed at its CDT and its
            # CST time and only the one matching Central's offset today
            # counts. One cron pinned to CDT fires an hour early all winter,
            # when /api/scheduler/ran still answers for yesterday's slot.
            if [ "$(TZ=America/Chicago date -d "${GATE_NOW:-now}" +%z)" = "-0500" ]; then want="$CDT_CRON"; else want="$CST_CRON"; fi
            if [ "$SCHEDULE" != "$want" ]; then
              echo "This is the other DST's cron ($SCHEDULE); the $want run covers today."; run=false
            elif curl -fsS --max-time 20 "$SITE/api/scheduler/ran?job=newsletter" | grep -q '"ran":true'; then
              echo "The site's scheduler already ran this week's send; skipping this late cron run."; run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  send:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 3 tries of up to 5 minutes each, 4 minutes apart.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6   # for scripts/slack_notify.py
      - name: Send this week's newsletter
        env:
          SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}
          SITE: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: |
          if [ -z "$SECRET" ]; then echo "::error::NEWSLETTER_CRON_SECRET is not set"; exit 1; fi
          # A 5xx or no answer (Railway mid-restart, a Resend blip) is tried
          # again, up to 3 times about 4 minutes apart. That's safe:
          # sendWeekly (server/newsletter.js) answers already-sent for a sent
          # week, a partial send resumes with only the failed addresses, and
          # its per-week Resend idempotency keys stop a request that timed
          # out mid-send from mailing anyone twice. A 4xx (wrong secret)
          # won't fix itself, so it fails at once.
          for try in 1 2 3; do
            : > out.json
            code=$(curl -sS --max-time 300 -o out.json -w '%{http_code}' -X POST -H "X-Cron-Secret: $SECRET" -H "X-Cron-Scheduled: $SCHEDULED" "$SITE/api/newsletter/cron") || true
            cat out.json; echo
            [ "$code" = "200" ] && exit 0
            case "$code" in 5*|000|"") ;; *) break ;; esac
            [ "$try" = 3 ] || { echo "HTTP $code; trying again in 4 minutes"; sleep 240; }
          done
          echo "::error::Newsletter send returned HTTP $code"; exit 1

      - name: Tell Slack it failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/slack_notify.py "🚨 Monday newsletter send failed" --link "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
