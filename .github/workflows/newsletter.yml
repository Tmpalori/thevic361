# Newsletter — sends this week's email to subscribers on Monday morning by
# calling the site's /api/newsletter/cron endpoint (server/newsletter.js),
# after Sunday-night Save & Publish. 12:43 UTC is 7:43 AM CDT / 6:43 AM CST.
#
# Runs every Monday. The NEWSLETTER_CRON_SECRET secret must match the
# Railway variable of the same name (that's what the admin's "Auto-send
# Mondays" reflects); if it's missing or wrong the run fails and Slack is
# told, instead of skipping quietly. A week that was already sent from the
# admin is skipped. A server error or no answer is tried again twice, a few
# minutes apart (safe: the send resumes and never mails anyone twice).
# The same call sends last week's sponsor click reports.

name: Newsletter

on:
  schedule:
    - cron: '43 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    # 3 tries of up to 5 minutes each, 4 minutes apart.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6   # for scripts/slack_notify.py
      - name: Send this week's newsletter
        env:
          SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}
          SITE: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
        run: |
          if [ -z "$SECRET" ]; then echo "::error::NEWSLETTER_CRON_SECRET is not set"; exit 1; fi
          # A 5xx or no answer (Railway mid-restart, a Resend blip) is tried
          # again, up to 3 times about 4 minutes apart. That's safe:
          # sendWeekly (server/newsletter.js) answers already-sent for a sent
          # week, a partial send resumes with only the failed addresses, and
          # its per-week Resend idempotency keys stop a request that timed
          # out mid-send from mailing anyone twice. A 4xx (wrong secret)
          # won't fix itself, so it fails at once.
          for try in 1 2 3; do
            : > out.json
            code=$(curl -sS --max-time 300 -o out.json -w '%{http_code}' -X POST -H "X-Cron-Secret: $SECRET" "$SITE/api/newsletter/cron") || true
            cat out.json; echo
            [ "$code" = "200" ] && exit 0
            case "$code" in 5*|000|"") ;; *) break ;; esac
            [ "$try" = 3 ] || { echo "HTTP $code; trying again in 4 minutes"; sleep 240; }
          done
          echo "::error::Newsletter send returned HTTP $code"; exit 1

      - name: Tell Slack it failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/slack_notify.py "🚨 Monday newsletter send failed" --link "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
