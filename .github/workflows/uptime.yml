# ─── Uptime check ───────────────────────────────────────────────────────────
# Every 5 minutes (GitHub's shortest schedule; runs can start a few minutes
# late): the homepage, /api/health?deep=1 (server + database) and
# /events.json must answer fast, and the feed must have events. See
# scripts/uptime_check.py. Alerts Slack (SLACK_ALERTS_WEBHOOK_URL, else
# SLACK_WEBHOOK_URL) and, with the NTFY_TOPIC secret, a phone push via the
# ntfy app: once when it goes down, hourly while down, once when it's back.
# Once a day it also flags a stale feed: nothing published for 8+ days.
# That's its own job and concurrency group: a group keeps only one pending
# run, so in the shared group a */5 run could replace the queued daily one.
# ─────────────────────────────────────────────────────────────────────────────
name: Uptime

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 15 * * *'   # stale-feed check, ~10 AM Central
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event.schedule != '17 15 * * *'
    concurrency:
      group: uptime
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      # Down/up state from the last run, so an outage alerts once (plus
      # hourly reminders), not every 5 minutes.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .uptime
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-
      - name: Check the live site
        env:
          SITE: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          mkdir -p .uptime
          python3 scripts/uptime_check.py "$SITE" .uptime/state.json
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .uptime
          key: uptime-state-${{ github.run_id }}

  stale-feed:
    if: github.event.schedule == '17 15 * * *'
    concurrency:
      group: uptime-stale-feed
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      - name: Stale feed
        env:
          SITE: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: |
          # A site that's down is the check job's alert, not a stale feed.
          curl -fsS --max-time 30 -o events.json "$SITE/events.json" ||
            { echo "::warning::Couldn't fetch events.json; skipping the stale-feed check."; exit 0; }
          age=$(python3 scripts/feed_age.py events.json 2>/dev/null || echo 99)
          if [ "$age" -ge 8 ]; then
            python3 scripts/slack_notify.py "⏰ No events published in $age days. Pick this week's events in admin." --link "$SITE/admin.html"
          fi
