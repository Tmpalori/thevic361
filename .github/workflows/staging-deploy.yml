name: Deploy Staging

# Pushes the docs/ folder of the `staging` branch to
# https://tmpalori.github.io/thevic361-previews/staging/

on:
  push:
    branches: [staging]
    paths:
      - 'docs/**'
      - '.github/workflows/staging-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: staging
          path: source

      - name: Checkout previews repo via deploy key
        uses: actions/checkout@v6
        with:
          repository: Tmpalori/thevic361-previews
          ssh-key: ${{ secrets.PREVIEWS_DEPLOY_KEY }}
          path: previews

      - name: Sync staging docs into previews/docs/staging/
        run: |
          set -euo pipefail
          DEST="previews/docs/staging"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R source/docs/. "$DEST/"

      - name: Commit and push staging
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd previews
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "staging: deploy ${SHA:0:7}"
          git push origin main
