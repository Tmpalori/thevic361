# Social Kit — builds this week's / this weekend's slides and captions from
# the live published events and commits them to docs/social/latest/, which
# is served at https://www.thevic361.com/social/latest/ (noindex).
#
# Runs every morning at 13:47 UTC (8:47 AM CDT / 7:47 AM CST). Monday
# rebuilds the week, weekend and today kits; Thursday the weekend (plus its
# Reel) and today; other days only today, so the repo isn't rewriting the
# week's slides daily. It also rebuilds everything when the generator changes.
#
# Auto-posting to Facebook + Instagram (scripts/social_post.py) runs on the
# schedule only when the SOCIAL_AUTOPOST repo variable is 1 and the
# META_PAGE_ID / META_PAGE_TOKEN (+ optional IG_USER_ID) secrets are set.
# Monday posts "this week", Thursday "this weekend", other days "today".
# Monday also sends Slack the venues on this week's list (outreach.txt) so
# they can be sent their link to reshare.

name: Social Kit

on:
  schedule:
    - cron: '47 13 * * *'
  push:
    branches: [main]
    paths:
      - scripts/social_kit.py
      - scripts/social_post.py
      - .github/workflows/social-kit.yml
  workflow_dispatch:
    inputs:
      post:
        description: 'Also post to Facebook/Instagram'
        type: boolean
        default: false
      kind:
        description: 'Which kit to post'
        type: choice
        options: [weekend, week, today]
        default: weekend

permissions:
  contents: write

concurrency:
  group: social-kit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pillow requests
      # The weekend Reel is stitched with ffmpeg, which runner images don't
      # always include.
      - name: Install ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Build kit
        env:
          PYTHONUNBUFFERED: 1
          EVENT: ${{ github.event_name }}
        run: |
          DOW="$(TZ=America/Chicago date +%u)"
          if [ "$EVENT" != "schedule" ] || [ "$DOW" = "1" ]; then KINDS=week,weekend,today
          elif [ "$DOW" = "4" ]; then KINDS=weekend,today
          else KINDS=today; fi
          python scripts/social_kit.py --kinds "$KINDS"
      - name: Commit
        run: |
          git config user.name "The Vic 361 Bot"
          git config user.email "bot@thevic361.com"
          git add docs/social/latest
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "📣 Social kit $(date +'%Y-%m-%d')"
          # main may have moved while the kit built (weekly collect, a merge).
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
      - name: Post to Facebook + Instagram
        id: post
        if: >-
          (github.event_name == 'schedule' && vars.SOCIAL_AUTOPOST == '1') ||
          (github.event_name == 'workflow_dispatch' && inputs.post)
        env:
          PYTHONUNBUFFERED: 1
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DISPATCH_KIND: ${{ inputs.kind }}
        run: |
          DOW="$(TZ=America/Chicago date +%u)"
          if [ -n "$DISPATCH_KIND" ]; then KIND="$DISPATCH_KIND"
          elif [ "$DOW" = "1" ]; then KIND=week
          elif [ "$DOW" = "4" ]; then KIND=weekend
          else KIND=today; fi
          python scripts/social_post.py --kind "$KIND"

      # Record what was posted (posted.json) even when one platform failed,
      # so re-running the job doesn't post to the other one twice.
      - name: Save posted ids
        if: always() && steps.post.outcome != 'skipped' && hashFiles('docs/social/latest/posted.json') != ''
        run: |
          git config user.name "The Vic 361 Bot"
          git config user.email "bot@thevic361.com"
          git add docs/social/latest/posted.json
          git diff --cached --quiet && exit 0
          git commit -m "📣 Social posts $(date +'%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1

      - name: Send Slack this week's venues to tag
        if: always() && github.event_name == 'schedule' && hashFiles('docs/social/latest/outreach.txt') != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ACTIVITY_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ "$(TZ=America/Chicago date +%u)" = "1" ] || exit 0
          [ -s docs/social/latest/outreach.txt ] || exit 0
          python3 scripts/slack_notify.py "📣 Venues on this week's list. Send each one its link; they usually reshare:
          $(head -25 docs/social/latest/outreach.txt)"

      - name: Tell Slack it failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/slack_notify.py "🚨 Social kit (build or Facebook/Instagram post) failed" --link "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
