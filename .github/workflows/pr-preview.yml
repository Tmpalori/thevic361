name: PR Preview

# Deploys docs/ to https://tmpalori.github.io/thevic361-previews/pr-<N>/ on PR open/sync.
# Removes the folder when the PR closes.
#
# Static files only: the live site is Express (server-rendered pages, /api,
# events from Postgres), so this copy shows the old bundled events.json and
# broken forms. Every page gets a banner saying so (scripts/preview_banner.py);
# Railway's per-PR environment is the real preview.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'docs/**'
      - '.github/workflows/pr-preview.yml'

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: source

      - name: Checkout previews repo via deploy key
        uses: actions/checkout@v6
        with:
          repository: Tmpalori/thevic361-previews
          ssh-key: ${{ secrets.PREVIEWS_DEPLOY_KEY }}
          path: previews

      - name: Sync PR docs into previews/docs/pr-<N>/
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          DEST="previews/docs/pr-${PR_NUMBER}"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R source/docs/. "$DEST/"
          # Say on every page that this is a static copy (stale events, no
          # server pages or /api), so the preview can't mislead a reviewer.
          python3 source/scripts/preview_banner.py "$DEST" "PR #${PR_NUMBER} preview"

      - name: Commit and push preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd previews
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "preview: PR #${PR_NUMBER} @ ${SHA:0:7} — ${PR_TITLE}"
          # Other previews push to the same branch; rebase and retry on a race.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = context.payload.pull_request.number;
            const url = `https://tmpalori.github.io/thevic361-previews/pr-${prNum}/`;
            const marker = '<!-- thevic361-preview-bot -->';
            const body = `${marker}\n🌼 **Static preview of docs/:** ${url}\n\n` +
              `This is only the static files: events are the old bundled list, and server-rendered pages (home, event and venue pages), forms and /api calls don't work. ` +
              `For a real preview, open this PR's Railway environment.\n\nUpdates automatically when you push new commits to this PR. Removed when the PR closes.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNum
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNum, body
              });
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout previews repo
        uses: actions/checkout@v6
        with:
          repository: Tmpalori/thevic361-previews
          ssh-key: ${{ secrets.PREVIEWS_DEPLOY_KEY }}
          path: previews

      - name: Remove PR folder
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          cd previews
          DEST="docs/pr-${PR_NUMBER}"
          if [ ! -d "$DEST" ]; then
            echo "No preview folder to remove."
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git rm -rf "$DEST"
          git commit -m "preview: cleanup PR #${PR_NUMBER}"
          # Other previews push to the same branch; rebase and retry on a race.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((i * 5))
          done
          exit 1
