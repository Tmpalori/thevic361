name: PR Preview

# Deploys docs/ to https://tmpalori.github.io/thevic361-previews/pr-<N>/ on PR open/sync.
# Removes the folder when the PR closes.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'docs/**'
      - '.github/workflows/pr-preview.yml'

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: source

      - name: Checkout previews repo via deploy key
        uses: actions/checkout@v6
        with:
          repository: Tmpalori/thevic361-previews
          ssh-key: ${{ secrets.PREVIEWS_DEPLOY_KEY }}
          path: previews

      - name: Sync PR docs into previews/docs/pr-<N>/
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          DEST="previews/docs/pr-${PR_NUMBER}"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R source/docs/. "$DEST/"

      - name: Commit and push preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd previews
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "preview: PR #${PR_NUMBER} @ ${SHA:0:7} — ${PR_TITLE}"
          git push origin main

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = context.payload.pull_request.number;
            const url = `https://tmpalori.github.io/thevic361-previews/pr-${prNum}/`;
            const marker = '<!-- thevic361-preview-bot -->';
            const body = `${marker}\n🌼 **Preview deployed:** ${url}\n\nUpdates automatically when you push new commits to this PR. Removed when the PR closes.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNum
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNum, body
              });
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout previews repo
        uses: actions/checkout@v6
        with:
          repository: Tmpalori/thevic361-previews
          ssh-key: ${{ secrets.PREVIEWS_DEPLOY_KEY }}
          path: previews

      - name: Remove PR folder
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          cd previews
          DEST="docs/pr-${PR_NUMBER}"
          if [ ! -d "$DEST" ]; then
            echo "No preview folder to remove."
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git rm -rf "$DEST"
          git commit -m "preview: cleanup PR #${PR_NUMBER}"
          git push origin main
