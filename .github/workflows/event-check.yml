# Event check — one look over the live event list for anything off
# (scripts/sweep_events.py): duplicates, wrong days, non-events, church
# events, odd times. Rule-certain church events, non-events and exact
# duplicates are hidden (server/eventcheck.js; never deleted, restore on
# admin Home); everything else is reported. One Slack message either way.
# Hiding needs EVENT_CHECK_SECRET (or NEWSLETTER_CRON_SECRET) set the same
# in Railway and here; without it the check only reports.
#
# When:
#   - after each successful Weekly Collect, once auto-publish has put the
#     new events on the site (the collect commit redeploys Railway, which
#     publishes on boot, so we wait for /events.json to change)
#   - Monday 11:43 UTC (6:43 AM CDT), an hour before the newsletter, to
#     catch anything from Sunday-night edits
#   - by hand (workflow_dispatch)

name: Event Check

on:
  workflow_run:
    workflows: ['Weekly Collect']
    types: [completed]
  schedule:
    - cron: '43 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The collect run commits candidates.json; Railway redeploys and
      # auto-publish runs on boot. Wait (up to 15 min) until the live list
      # was published after these candidates were made (candidates.json's
      # own last_updated, from the commit this job checked out), then
      # check it. Timestamps are compared as times: the collector writes
      # Central time, the site UTC.
      - name: Wait for the new events to go live
        if: github.event_name == 'workflow_run'
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          from datetime import datetime
          made = datetime.fromisoformat(json.load(open("candidates.json"))["last_updated"].replace("Z", "+00:00"))
          for _ in range(30):
              try:
                  live = json.load(urllib.request.urlopen("${{ vars.SITE_URL || 'https://www.thevic361.com' }}/events.json", timeout=30))
                  updated = datetime.fromisoformat((live.get("last_updated") or "").replace("Z", "+00:00"))
                  if updated >= made:
                      print(f"Live list updated at {updated}, candidates made {made}")
                      raise SystemExit(0)
              except (ValueError, OSError) as e:
                  print(f"waiting: {e}")
              time.sleep(30)
          print("::warning::Live list didn't update within 15 minutes; checking what's there now.")
          PY

      - name: Check the live events
        timeout-minutes: 5
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          EVENT_CHECK_SECRET: ${{ secrets.EVENT_CHECK_SECRET || secrets.NEWSLETTER_CRON_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ACTIVITY_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/sweep_events.py

      - name: Tell Slack it failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/slack_notify.py "🚨 Event check failed" --link "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
