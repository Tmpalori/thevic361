# Event check — one look over the live event list for anything off
# (scripts/sweep_events.py): duplicates, wrong days, non-events, church
# events, odd times. Rule-certain church events, non-events and exact
# duplicates are hidden (server/eventcheck.js; never deleted, restore on
# admin Home); everything else is reported. One Slack message either way.
# Hiding needs EVENT_CHECK_SECRET (or NEWSLETTER_CRON_SECRET) set the same
# in Railway and here; without it the check only reports.
#
# When:
#   - after each successful Weekly Collect, once auto-publish has put the
#     new events on the site (the collect commit redeploys Railway, which
#     publishes on boot, so we wait for /events.json to change)
#   - Monday 6:43 AM Central, an hour before the newsletter, to catch
#     anything from Sunday-night edits (and Thursday 6:00 AM, before the
#     weekend issue, dispatched by the site only). The site's scheduler
#     (server/scheduler.js) dispatches it on time, because GitHub's own
#     cron runs hours late; the 11:43 (CDT) / 12:43 (CST) UTC crons are a fallback that
#     skips itself when the site already ran it
#   - by hand (workflow_dispatch)

name: Event Check

on:
  workflow_run:
    workflows: ['Weekly Collect']
    types: [completed]
  schedule:
    - cron: '43 11 * * 1'   # CDT slot (fallback; the gate keeps the one matching DST)
    - cron: '43 12 * * 1'   # CST slot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SITE: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          CDT_CRON: '43 11 * * 1'
          CST_CRON: '43 12 * * 1'
        run: |
          run=true
          if [ "$EVENT" = "schedule" ]; then
            # GitHub's cron is UTC, so the slot is listed at its CDT and its
            # CST time and only the one matching Central's offset today
            # counts. One cron pinned to CDT fires an hour early all winter,
            # when /api/scheduler/ran still answers for yesterday's slot.
            if [ "$(TZ=America/Chicago date -d "${GATE_NOW:-now}" +%z)" = "-0500" ]; then want="$CDT_CRON"; else want="$CST_CRON"; fi
            if [ "$SCHEDULE" != "$want" ]; then
              echo "This is the other DST's cron ($SCHEDULE); the $want run covers today."; run=false
            elif curl -fsS --max-time 20 "$SITE/api/scheduler/ran?job=event-check" | grep -q '"ran":true'; then
              echo "The site's scheduler already ran Monday's check; skipping this late cron run."; run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The collect run commits candidates.json; Railway redeploys and
      # auto-publish runs on boot. Wait (up to 15 min) until the live list
      # holds these candidates (from the commit this job checked out), then
      # check it. A newer last_updated alone isn't enough: a submission
      # approved or an admin publish during the deploy bumps it too. See
      # wait_for_publish in scripts/sweep_events.py. If they never go live,
      # it alerts Slack and the check runs on what's there.
      - name: Wait for the new events to go live
        if: github.event_name == 'workflow_run'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          # A timeout (no deploy) alerts the owner here; the check still runs.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/sweep_events.py --wait-for candidates.json

      - name: Check the live events
        timeout-minutes: 5
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.thevic361.com' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          EVENT_CHECK_SECRET: ${{ secrets.EVENT_CHECK_SECRET || secrets.NEWSLETTER_CRON_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ACTIVITY_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
          # Paid Vic's Picks a rule would hide are never hidden; they go to
          # sales (else alerts) so the buyer hears from a person.
          SLACK_SALES_WEBHOOK_URL: ${{ secrets.SLACK_SALES_WEBHOOK_URL }}
          SLACK_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/sweep_events.py

      - name: Tell Slack it failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL }}
        run: python3 scripts/slack_notify.py "🚨 Event check failed" --link "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
