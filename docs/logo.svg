<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="The Vic 361">
  <!-- The Vic water tower (same shape as skyline.svg) as a round sticker. -->
  <defs><clipPath id="c"><circle cx="64" cy="64" r="57"/></clipPath></defs>
  <circle cx="64" cy="64" r="57" fill="#8FD3FF"/>
  <g clip-path="url(#c)" stroke="#1F1A3D" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- legs and braces -->
    <path d="M44 72l-10 40M84 72l10 40M64 76v36M40 94h48M42 94l42-16M86 94l-42-16" fill="none" stroke-width="4.5"/>
    <!-- hill -->
    <path d="M-4 110Q64 96 132 110V132H-4Z" fill="#3DBE8B"/>
    <!-- tank: roof, body and rounded bottom in one color -->
    <path d="M28 44Q36 22 64 20Q92 22 100 44V60Q100 78 64 78Q28 78 28 60Z" fill="#FFC93C"/>
    <!-- finial and roof seam -->
    <path d="M64 20v-6" fill="none" stroke-width="4"/>
    <circle cx="64" cy="12" r="3.5" fill="#FFC93C" stroke-width="3"/>
    <path d="M28 44Q64 50 100 44" fill="none" stroke-width="3.5"/>
    <!-- shine -->
    <path d="M38 37Q42 29 52 26" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.8"/>
    <text x="64" y="71" text-anchor="middle" font-family="Fredoka, 'Arial Black', Arial, sans-serif" font-weight="700" font-size="25" fill="#1F1A3D" stroke="none">Vic</text>
    <g fill="#4B3FD1" stroke-width="2.5">
      <circle cx="22" cy="104" r="4.5"/><circle cx="22" cy="95" r="4.5"/><circle cx="30" cy="102" r="4"/>
      <circle cx="106" cy="104" r="4.5"/><circle cx="106" cy="95" r="4.5"/><circle cx="98" cy="102" r="4"/>
    </g>
  </g>
  <circle cx="64" cy="64" r="57" fill="none" stroke="#1F1A3D" stroke-width="6"/>
</svg>
